services:
  postgres:
    image: postgres:16
    container_name: auth-service-postgres
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d auth_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
